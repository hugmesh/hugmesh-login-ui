# HugMesh CI — build + push this service's container image to the in-cluster
# GitLab container registry. The GitHub repo is pull-mirrored into in-cluster
# GitLab (mirror_trigger_builds=true), so this runs on push / mirror-sync on the
# privileged x86 runner (shell executor with docker, matching the generator CI).
# Images carry NO keys — KEYS material is supplied from the USB at first boot.

# Centralized OWASP pen-test stage (SCA + authenticated ZAP DAST) — one source of
# truth, maintained in the generator repo. Pulls in the hidden .pentest-* jobs.
include:
  - project: 'hugmesh/hugmesh-generator'
    ref: main
    file: '/tests/pentest/ci/pentest-stage.gitlab-ci.yml'

stages: [test, build, pentest]

test:
  stage: test
  tags: [hugmesh-x86, privileged]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
  script:
    - docker run --rm --shm-size=1gb -v "${CI_PROJECT_DIR}:/workspace:ro" -w /workspace node:24-alpine sh -c "apk add --no-cache chromium && npm ci && CHROME_BIN=/usr/bin/chromium npm test"
  artifacts:
    when: always
    reports:
      junit:
        - reports/TESTS-*.xml
        - test-results/results.xml
    paths:
      - reports/
      - test-results/
    expire_in: 7 days

# -----------------------------------------------------------------------------
# UI e2e — Playwright + playwright-bdd (Gherkin) auth-entry-point harness.
# THIS JOB RUNS THE OFFLINE GATE ONLY — it does NOT execute scenarios.
#
# The suite has two classes (see e2e/README.md): OFFLINE scenarios that mock the
# /bff/* (and loopback-agent / catalog) boundary via page.route and run the real
# component pipeline, and @cluster scenarios that need a live integration-test
# host. NEITHER can execute in this job as-is: the offline scenarios still need
# the REMOTE ITSELF served at the baseURL (this job serves no app), and @cluster
# scenarios need a live host + E2E_LIVE=1. So this job installs, generates the
# specs (`bddgen`) and runs `--list`, which PROVES every scenario compiles and
# every Gherkin step is bound — a real, deterministic gate — without pretending to
# run the scenarios (the previous `playwright test` line only ever failed against
# an unserved baseURL and was hidden by allow_failure). To actually EXECUTE the
# offline suite, serve the built remote and point E2E_BASE_URL at it (see
# e2e/README.md's "Running the offline suite locally"); wiring that served-remote
# run into CI is tracked separately. allow_failure so an install/gen hiccup
# surfaces in the MR widget without blocking the additive image pipeline. Runs in
# its own isolated `e2e/` workspace; no app/karma change. Uses the pre-baked
# Playwright image (Chromium + OS deps inside) on the privileged x86 runner.
e2e:bdd:
  stage: test
  tags: [hugmesh-x86, privileged]
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - >
      docker run --rm -v "${CI_PROJECT_DIR}/e2e:/work" -w /work
      mcr.microsoft.com/playwright:v1.49.0-jammy
      sh -c "npm install --no-audit --no-fund &&
             npx bddgen &&
             npx playwright test --list"
  artifacts:
    when: always
    paths:
      - e2e/results/
    expire_in: 7 days

build:image:
  needs: [test]
  stage: build
  tags: [hugmesh-x86, privileged]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # Immutable tag = release tag or git SHA; plus a moving branch tag the deploy/
    # kustomize can track for dev.
    - export TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - docker build --pull -t "$CI_REGISTRY_IMAGE:$TAG" -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG" .
    - docker push "$CI_REGISTRY_IMAGE:$TAG"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"

# -----------------------------------------------------------------------------
# OWASP pen-test stage — thin jobs that extend the centralized hidden jobs
# (.pentest-sca / .pentest-dast-baseline) included from the generator repo above.
# Non-blocking (allow_failure) so a finding surfaces in the MR widget without
# breaking the additive build/image pipeline. Rules mirror this repo's existing
# security-job rules: default branch + merge requests.
# -----------------------------------------------------------------------------
pentest:sca:
  extends: .pentest-sca
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

pentest:dast:
  extends: .pentest-dast-baseline
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
