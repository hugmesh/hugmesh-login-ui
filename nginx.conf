# Per-request CSP nonce source. This file is included inside the main nginx
# http{} block (COPYied to /etc/nginx/conf.d/default.conf), so `map` — which is
# only valid in http scope — belongs here, above the server block. $request_id
# is a unique 16-byte hex token nginx generates for every request, giving each
# response a fresh, unguessable nonce.
map $request_id $cspnonce { default $request_id; }

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers (defence-in-depth) ───────────────────────────────────
    # Inspection-safe for an Angular SPA + module-federation remotes + OAuth
    # redirect flows: none of these block same-origin scripts, cross-origin
    # script-based federation, or redirect-based login. Emitted with `always` so
    # they also cover error responses.
    #   - nosniff: stop MIME-type sniffing.
    #   - X-Frame-Options DENY: clickjacking protection. DENY (not SAMEORIGIN) so
    #     it stays consistent with the CSP `frame-ancestors 'none'` below — module
    #     federation loads remotes via <script>, NOT iframes, so framing is never
    #     needed and is refused outright.
    #   - Referrer-Policy: don't leak full URLs cross-origin.
    #   - HSTS: pin HTTPS for a year incl. subdomains (only affects HTTPS responses).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Native-federation remote: the hugmesh.net host fetches
    # remoteEntry.json + the shared/exposed chunks cross-origin, so allow CORS
    # on every bundle this remote serves.
    #
    # Content-Security-Policy (XSS backstop): a STRONG nonce-based CSP. Every
    # <script> tag in the served index.html is rewritten by sub_filter to carry
    # a per-request nonce that also appears in `script-src 'nonce-...'`, so the
    # app's own bootstrap (and the generator's per-install inline OIDC <script>,
    # which is injected post-build) execute, while any INJECTED inline script —
    # which cannot know the per-request nonce — is blocked. No 'unsafe-inline'
    # and no 'unsafe-hashes' in script-src.
    #   - default-src 'self'                : same-origin default for everything.
    #   - script-src 'self' 'nonce-$cspnonce' blob:
    #                                       : same-origin + per-request nonce +
    #                                         blob: (es-module-shims / federation
    #                                         workers). NO unsafe-inline.
    #   - style-src 'self' 'unsafe-inline' blob:
    #                                       : Angular inlines component styles, so
    #                                         'unsafe-inline' is REQUIRED here.
    #   - img-src 'self' data: blob: https: : logos/media incl. data:/blob:/https:.
    #   - font-src 'self' data:             : webfonts incl. inlined data: fonts.
    #   - connect-src 'self' blob: https: wss:
    #                                       : the BFF/gateway/Casdoor origins are
    #                                         env-configured, so this is deliberately
    #                                         broad.
    #   - worker-src 'self' blob:           : federation/shims spawn blob: workers.
    #   - base-uri 'self'                   : stop <base> tag hijacking.
    #   - object-src 'none'                 : block <object>/<embed>.
    #   - frame-ancestors 'none'            : refuse all framing (matches X-Frame DENY).
    # NOTE: nginx add_header does NOT merge across blocks — a child block with any
    # add_header discards inherited ones — so the CSP + security headers are set
    # here, in the block that actually serves index.html (where XSS would run).
    location / {
        # Rewrite every '<script' to '<script nonce="$cspnonce"' so the served
        # nonce matches the CSP. text/html only (bundles/JS are untouched), and
        # sub_filter_once OFF so it covers EVERY script tag, incl. the generator's
        # post-build inline OIDC script. Do NOT enable gzip_static/precompressed
        # index.html — sub_filter cannot rewrite a pre-gzipped response.
        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter '<script' '<script nonce="$cspnonce"';

        add_header Access-Control-Allow-Origin "*" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$cspnonce' blob:; style-src 'self' 'unsafe-inline' blob:; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' blob: https: wss:; worker-src 'self' blob:; base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;
        # Re-emit server-scope security headers: this location has its own
        # add_header, so nginx would otherwise drop the inherited ones.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri $uri/ /index.html;
    }

    # Runtime OIDC config file, WRITTEN at container start by
    # /docker-entrypoint.d/40-snap-config.sh from the SNAP_OIDC_* / SNAP_BFF_URL
    # env. Served no-store so a per-environment env change takes effect on the
    # next container restart instead of being pinned by a cached copy; index.html
    # loads it (as a same-origin <script src>) BEFORE the app bootstrap. It is a
    # served STATIC file (nginx uses the inherited root), so no return/proxy here.
    location = /snap-config.js {
        add_header Cache-Control "no-store" always;
        # nginx add_header does NOT merge across blocks, so re-emit the
        # server-scope security headers this block would otherwise drop.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Runtime theme stylesheet, WRITTEN at container start by
    # /docker-entrypoint.d/50-snap-theme.sh from SNAP_THEME_CSS. no-store for the
    # same reason as snap-config.js: a rebrand is env change + pod restart, and a
    # cached copy would pin the OLD brand in every returning browser.
    location = /snap-theme.css {
        add_header Cache-Control "no-store" always;
        # Re-emit server-scope security headers (add_header does not merge).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location = /healthz {
        return 200 'ok';
        add_header Content-Type text/plain;
        # Re-emit server-scope security headers: this location has its own
        # add_header, so nginx would otherwise drop the inherited ones.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}
